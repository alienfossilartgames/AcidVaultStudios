<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Transmissions Arriving Soon - Meatworld</title>
  
  <!-- Link to your shared styles.css file -->
  <link rel="stylesheet" href="/assets/styles.css">
  
  <!-- Inline styles specifically for this splash page -->
  <style>
    /* Strict override for pure black background */
    body {
      background-color: #000000 !important;
      background-image: none !important; /* Forces the background image to disappear */
      margin: 0;
      padding: 0;
      overflow: hidden; /* Prevents scrollbars */
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      height: 100vh;
      color: var(--mw-red); /* Pulls the red variable from your styles.css */
    }

    /* Container to tightly wrap the centered content */
    .center-wrapper {
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      width: 100%;
      max-width: 100vw;
      padding: 1rem;
    }

    /* Top Text Graphic */
    .top-text-img {
      max-width: 80vw; /* Prevents it from touching the edges of a phone screen */
      height: auto;
      margin-bottom: 2rem;
    }

    /* The Video */
    .center-video {
      max-width: 100%; /* Will scale down on mobile */
      width: auto;
      height: auto; /* Maintains aspect ratio */
      margin-bottom: 2rem;
    }

    /* Bottom Text */
    .bottom-header {
      font-family: 'Black Ops One', 'Bebas Neue', sans-serif; /* Uses your custom fonts */
      font-size: clamp(2rem, 5vw, 4rem); /* Responsive sizing so it shrinks on phones */
      letter-spacing: 3px;
      text-transform: uppercase;
      text-align: center;
      margin: 0;
      text-shadow: 2px 2px 0px var(--mw-purple); /* Adds the faint purple glow from your theme */
    }
  </style>
</head>
<body>

  <!-- Centers everything horizontally and vertically -->
  <div class="center-wrapper">
    
    <!-- Top Image Graphic -->
    <img src="/assets/AVS_Text1.png" alt="Acid Vault Studios" class="top-text-img">
    
    <!-- Centered WebM Video -->
    <video autoplay loop muted playsinline class="center-video">
      <source src="/assets/AVS_IndexAnim1.webm" type="video/webm">
    </video>
    
    <!-- Bottom Header Text -->
    <h1 class="bottom-header">Transmissions Arriving Soon!</h1>
    
  </div>

</body>
</html>
