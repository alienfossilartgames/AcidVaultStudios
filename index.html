<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Transmissions Arriving Soon - Acid Vault Studios</title>
  
  <style>
    /* 1. Pure black background, perfectly centered vertically and horizontally */
    body {
      background-color: #000000;
      margin: 0;
      padding: 0;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: Arial, sans-serif;
    }

    /* 2. The main wrapper that controls the 75% width */
    .content-wrapper {
      width: 75%;
      max-width: 900px; /* Stops it from getting insanely huge on 4K monitors */
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
    }

    /* 3. Forces the image and video to fit perfectly inside the 75% wrapper */
    .splash-media {
      max-width: 1000px;
      max-height: 100%;
      width: 75vw;
      height: auto; 
      margin-bottom: 0px; /* Adds a nice gap between the image, video, and text */
    }

     /* 3. Forces the image and video to fit perfectly inside the 75% wrapper */
    .vid-media {
      max-width: 100vw;
      max-height: 60vh; 
      width: auto;
      height: auto;
      margin-bottom: 25px; /* Adds a nice gap between the image, video, and text */
      border: 2px solid #00ff88; /* Adds a bright 5px green border */
    }

    /* 4. Simple, easy-to-change text styling */
    .splash-text {
      color: #7900C7; /* Acid Vault Purple */
      font-size: 3rem;
      margin: 0;
      text-transform: uppercase;
      letter-spacing: 3px;
    }

    /* 5. Mobile tweak: gives a little more breathing room on small screens */
    @media (max-width: 768px) {
      .content-wrapper {
        width: 90%; 
      }
      .splash-text {
        font-size: 1.8rem; /* Shrinks the text slightly for phones */
      }
    }
  </style>
</head>
<body>

  <!-- Everything inside this div will follow the 75% width rule -->
  <div class="content-wrapper">
    
    <!-- Top Graphic -->
    <img src="/assets/AVS_Text1.png" alt="Acid Vault Studios" class="splash-media">
    
    <!-- Centered Video -->
    <video autoplay loop muted playsinline class="vid-media">
      <source src="/assets/AVS_IndexAnim1.webm" type="video/webm">
    </video>
    
    <!-- Bottom Text -->
    <h1 class="splash-text">Transmissions Arriving Soon!</h1>
    
  </div>

</body>
</html>
